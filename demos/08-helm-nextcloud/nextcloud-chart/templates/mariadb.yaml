apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}-db"
  labels:
    app: "{{ .Release.Name }}-db"
spec:
  serviceName: "{{ .Release.Name }}-db"
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-db"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-db"
    spec:
      containers:
        - name: mariadb
          image: "{{ .Values.database.image }}"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.global.secretName }}"
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.global.secretName }}"
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.global.secretName }}"
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.global.secretName }}"
                  key: MYSQL_DATABASE
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: "{{ .Values.database.storage }}"
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-db"
  labels:
    app: "{{ .Release.Name }}-db"
spec:
  clusterIP: None
  selector:
    app: "{{ .Release.Name }}-db"
  ports:
    - protocol: TCP
      port: 3306
