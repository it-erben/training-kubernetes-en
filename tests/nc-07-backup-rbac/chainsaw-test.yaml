apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nc-07-backup-rbac
  labels: { suite: nextcloud }
spec:
  steps:
    - try:
        - script:
            # Schema-validate the plain manifests offline. No cluster workloads
            # are scheduled and no namespace needs to pre-exist.
            content: |
              kubeconform -strict -summary -kubernetes-version 1.32.0 \
                ../../solutions/nextcloud-casestudy/07-backup-rbac/backup-pvc.yaml \
                ../../solutions/nextcloud-casestudy/07-backup-rbac/rbac.yaml \
                ../../solutions/nextcloud-casestudy/07-backup-rbac/backup-cronjob.yaml \
                ../../solutions/nextcloud-casestudy/07-backup-rbac/restore-job.yaml
            check:
              ($error == null): true
    - try:
        - script:
            content: |
              set -euo pipefail
              backup=../../solutions/nextcloud-casestudy/07-backup-rbac/backup-cronjob.yaml
              restore=../../solutions/nextcloud-casestudy/07-backup-rbac/restore-job.yaml
              rbac=../../solutions/nextcloud-casestudy/07-backup-rbac/rbac.yaml
              lab=../../labs/nextcloud-casestudy/lab-07-backup-rbac/README.md
              solution=../../solutions/nextcloud-casestudy/07-backup-rbac/README.md
              grep -q 'mariadb-dump -uroot -p"$MYSQL_ROOT_PASSWORD"' "$backup"
              grep -q -- '--databases nextcloud' "$backup"
              ! grep -q 'MYSQL_ROOT_PASSWORD" nextcloud' "$restore"
              awk '/resources: \["pods\/exec"\]/{execRule=1} \
                execRule && /resourceNames: \["nextcloud-db-0"\]/{scoped=1} \
                END{exit !scoped}' "$rbac"
              ! grep -q -- '--resource-name' "$lab" "$solution"
              grep -q 'exec nextcloud-db-0 -- sh -c true' "$lab" "$solution"
            check:
              ($error == null): true
