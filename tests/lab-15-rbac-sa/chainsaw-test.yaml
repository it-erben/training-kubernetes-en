apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lab-15-rbac-sa
  labels: { suite: labs }
spec:
  steps:
    - try:
        - apply: { file: ../../labs/kubernetes/lab-15-rbac/sa.yaml }
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata: { name: pod-reader }
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata: { name: read-pods }
