apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nc-03-secrets
  labels: { suite: nextcloud }
spec:
  steps:
    - try:
        - script:
            # Server-side dry-run: full admission + schema + quantity validation
            # without scheduling the (heavy) MariaDB/Nextcloud workloads.
            content: |
              kubectl apply --dry-run=server \
                -f ../../solutions/nextcloud-casestudy/03-secrets/secret.yaml \
                -f ../../solutions/nextcloud-casestudy/03-secrets/db-with-secret.yaml \
                -f ../../solutions/nextcloud-casestudy/03-secrets/pma-with-secret.yaml
            check:
              ($error == null): true
