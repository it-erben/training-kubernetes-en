apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lab-21-gateway
  labels: { suite: labs }
spec:
  steps:
    - try:
        - apply: { file: ../../labs/kubernetes/lab-21-gateway-api/01-deployment.yaml }
        - apply: { file: ../../labs/kubernetes/lab-21-gateway-api/02-service.yaml }
        - apply: { file: ../../labs/kubernetes/lab-21-gateway-api/03-gateway.yaml }
        - apply: { file: ../../labs/kubernetes/lab-21-gateway-api/04-httproute.yaml }
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: nginx-gateway-demo }
              status: { availableReplicas: 2 }
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata: { name: my-route }
