apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sol-19-hpa-pro
  labels: { suite: solutions }
spec:
  steps:
    - try:
        - apply: { file: ../../solutions/kubernetes/lab-19-hpa-pro/replicaset.yaml }
        - apply: { file: ../../solutions/kubernetes/lab-19-hpa-pro/hpa.yaml }
        - assert:
            resource:
              apiVersion: apps/v1
              kind: ReplicaSet
              metadata: { name: nginx-replicaset }
              status: { readyReplicas: 1 }
        - assert:
            resource:
              apiVersion: autoscaling/v1
              kind: HorizontalPodAutoscaler
              metadata: { name: nginx-hpa }
