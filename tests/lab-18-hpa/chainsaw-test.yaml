apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lab-18-hpa
  labels: { suite: labs }
spec:
  steps:
    - try:
        - apply: { file: ../../labs/kubernetes/lab-18-hpa/manifest.yaml }
        - apply: { file: ../../solutions/kubernetes/lab-18-hpa/hpa.yaml }
        - assert:
            resource:
              apiVersion: apps/v1
              kind: ReplicaSet
              metadata: { name: nginx-replicaset }
              status: { readyReplicas: 1 }
        - assert:
            resource:
              apiVersion: autoscaling/v1
              kind: HorizontalPodAutoscaler
              metadata: { name: nginx-hpa }
