apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sol-12-configmap-file
  labels: { suite: solutions }
spec:
  steps:
    - try:
        - apply: { file: ../../solutions/kubernetes/lab-12-configmap-file/nginx-configmap.yaml }
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata: { name: nginx-custom }
              status:
                phase: Running
                (conditions[?type == 'Ready'] | [0].status): "True"
