---
apiVersion: v1
kind: Service
metadata:
  name: nginx-pod-demo-svc
  labels:
    app: nginx-pod-demo
spec:
  selector:
    app: nginx-pod-demo # The selector determines which pods will belong to the service
  ports:
    - port: 80
      name: http
---
