apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-check-demo-deploy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: readiness-check-demo
  template:
    metadata:
      labels:
        app: readiness-check-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              port: 81
              path: /
          livenessProbe:
            httpGet:
              port: 80
              path: /
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: readiness-check-demo
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-check-demo-svc
  labels:
    app: readiness-check-demo
spec:
  selector:
    app: readiness-check-demo
  ports:
    - port: 80
      name: http
