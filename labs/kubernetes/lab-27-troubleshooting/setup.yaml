# Lab 27 - a webshop that a colleague deployed yesterday, broken eight ways.
# Applied into the `shop` namespace; every workload here fails for a different
# reason, and each one is repaired from inside k9s.
#
# 1. cache - Deployment references a Secret key that does not exist.
apiVersion: v1
kind: Secret
metadata:
  name: cache-auth
type: Opaque
stringData:
  password: s3cr3t
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: busybox:1.37
          command: ["sh", "-c", "echo cache ready; sleep 3600"]
          env:
            - name: CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cache-auth
                  # The Secret above stores this under `password`.
                  key: passwd
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
---
# 2. sessions - the container exits when a required variable is missing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sessions
  labels:
    app: sessions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sessions
  template:
    metadata:
      labels:
        app: sessions
    spec:
      containers:
        - name: sessions
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              if [ -z "$REDIS_HOST" ]; then
                echo "FATAL: REDIS_HOST not set"
                exit 1
              fi
              echo "sessions connected to $REDIS_HOST"
              sleep 3600
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
---
# 3. reports - a memory request no node can satisfy (64Mi was meant).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  labels:
    app: reports
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      containers:
        - name: reports
          image: nginx:1.29.4
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "64Gi"
            limits:
              cpu: "100m"
              memory: "64Gi"
---
# 4. crunch - builds a 100Mi report buffer in its own memory, under a limit
#    that cannot hold it. The buffer dies with the container, so every restart
#    repeats the same clean kill.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crunch
  labels:
    app: crunch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crunch
  template:
    metadata:
      labels:
        app: crunch
    spec:
      containers:
        - name: crunch
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "building report cache"
              dd if=/dev/zero of=/dev/null bs=100M count=1
              echo "cache built"
              sleep 3600
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
# 5. orders - the readiness probe hits a path nginx answers with 404, so the
#    pods run but never become Ready and the Service stays empty.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.4
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    app: orders
spec:
  selector:
    app: orders
  ports:
    - port: 80
      targetPort: 80
---
# 6. catalog - healthy pods, and a Service whose selector matches none of them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.4
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app: catalog
spec:
  selector:
    # The pods are labelled `catalog`.
    app: catalogue
  ports:
    - port: 80
      targetPort: 80
---
# 7. auditor - lists pods every 30s under its own identity. The Role grants it
#    configmaps instead, so the pod stays healthy while every loop is denied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auditor
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor
subjects:
  # A RoleBinding resolves a ServiceAccount subject in its own namespace, so
  # this manifest stays namespace-free.
  - kind: ServiceAccount
    name: auditor
roleRef:
  kind: Role
  name: auditor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditor
  labels:
    app: auditor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auditor
  template:
    metadata:
      labels:
        app: auditor
    spec:
      serviceAccountName: auditor
      containers:
        - name: auditor
          image: alpine/k8s:1.32.0
          command:
            - sh
            - -c
            - |
              while true; do
                echo "--- pod inventory ---"
                kubectl get pods
                sleep 30
              done
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
# 8. archive - the Deployment was pointed at a migration PVC that asks for a
#    StorageClass this cluster does not have, so it never binds.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archive-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archive-data-v2
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archive
  labels:
    app: archive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archive
  template:
    metadata:
      labels:
        app: archive
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.4
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html/archive
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: archive-data-v2
