apiVersion: v1
kind: Pod
metadata:
  name: loop
  labels:
    app: loop
spec:
  containers:
    - name: loop
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - while true; do date; sleep 1; done
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
