apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-nginx.fullname" (dict "root" . "name" "web") }}
  labels:
    app: {{ include "my-nginx.fullname" (dict "root" . "name" "web") }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "my-nginx.fullname" (dict "root" . "name" "web") }}
  template:
    metadata:
      labels:
        app: {{ include "my-nginx.fullname" (dict "root" . "name" "web") }}
    spec:
      containers:
      - name: nginx
        image: nginx:1.29.4
        ports:
          - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
