{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-nginx.fullname" (dict "root" . "name" "web") }}
spec:
  selector:
    app: {{ include "my-nginx.fullname" (dict "root" . "name" "web") }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 80
  type: {{ .Values.service.type }}
{{- end }}
