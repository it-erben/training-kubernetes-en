apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-check-demo-deploy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: readiness-check-demo
  template:
    metadata:
      labels:
        app: readiness-check-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine3.17
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              port: 80
              path: /
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-check-demo-svc
  labels:
    app: readiness-check-demo
spec:
  selector:
    app: readiness-check-demo
  ports:
    - port: 80
      name: http
