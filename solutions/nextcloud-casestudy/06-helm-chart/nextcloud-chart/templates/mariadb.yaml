apiVersion: v1
kind: Service
metadata:
  name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
  labels:
    app: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
spec:
  clusterIP: None
  selector:
    app: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db-clusterip`) }}"
  labels:
    app: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
spec:
  type: ClusterIP
  selector:
    app: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
  labels:
    app: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
spec:
  serviceName: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
  replicas: 1
  selector:
    matchLabels:
      app: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
  template:
    metadata:
      labels:
        app: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db`) }}"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mariadb
          image: "{{ .Values.database.image }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db-root`) }}"
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db-app`) }}"
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db-app`) }}"
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `db-app`) }}"
                  key: MYSQL_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "{{ .Values.database.resources.requests.cpu }}"
              memory: "{{ .Values.database.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.database.resources.limits.cpu }}"
              memory: "{{ .Values.database.resources.limits.memory }}"
          readinessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "{{ .Values.database.storage }}"
