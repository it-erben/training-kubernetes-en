# {{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `nextcloud`) }}"
# {{- with .Values.ingress.annotations }}
  annotations:
# {{- toYaml . | nindent 4 }}
# {{- end }}
spec:
# {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
# {{- end }}
  rules:
    - host: "{{ .Values.ingress.host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{ include `nextcloud-chart.fullname` (dict `root` . `name` `nextcloud`) }}"
                port:
                  number: 80
# {{- end }}
