apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-nextcloud-data"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: "{{ .Values.nextcloud.dataStorage }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-nextcloud-config"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: "{{ .Values.nextcloud.configStorage }}"
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-nextcloud"
  labels:
    app: "{{ .Release.Name }}-nextcloud"
spec:
  type: ClusterIP
  selector:
    app: "{{ .Release.Name }}-nextcloud"
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-nextcloud"
  labels:
    app: "{{ .Release.Name }}-nextcloud"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-nextcloud"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-nextcloud"
    spec:
      volumes:
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-nextcloud-data"
        - name: nextcloud-config
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-nextcloud-config"
      containers:
        - name: nextcloud
          image: "{{ .Values.nextcloud.image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: MYSQL_HOST
              value: "{{ .Release.Name }}-db-clusterip"
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-db-app"
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-db-app"
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-db-app"
                  key: MYSQL_PASSWORD
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "{{ .Values.nextcloud.trustedDomains }}"
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html/data
            - name: nextcloud-config
              mountPath: /var/www/html/config
          resources:
            requests:
              cpu: "{{ .Values.nextcloud.resources.requests.cpu }}"
              memory: "{{ .Values.nextcloud.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.nextcloud.resources.limits.cpu }}"
              memory: "{{ .Values.nextcloud.resources.limits.memory }}"
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 10
