apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-backup
  namespace: nextcloud
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: nextcloud-backup
        spec:
          serviceAccountName: nextcloud-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: bitnami/kubectl:1.32
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  POD=$(kubectl get pod -l app=nextcloud-db \
                    -o jsonpath='{.items[0].metadata.name}')
                  TS=$(date +%Y%m%d-%H%M%S)
                  kubectl exec "$POD" -- sh -c \
                    'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" \
                    --single-transaction nextcloud' > "/backup/nextcloud-$TS.sql"
                  cp "/backup/nextcloud-$TS.sql" /backup/latest.sql
                  echo "Backup written: nextcloud-$TS.sql"
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: nextcloud-backup
            - name: tmp
              emptyDir: {}
