apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextcloud-backup
  namespace: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-backup
  namespace: nextcloud
rules:
  # Find the MariaDB pod by label.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Run a command inside it (mysqldump / mysql). Nothing else.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-backup
  namespace: nextcloud
subjects:
  - kind: ServiceAccount
    name: nextcloud-backup
    namespace: nextcloud
roleRef:
  kind: Role
  name: nextcloud-backup
  apiGroup: rbac.authorization.k8s.io
