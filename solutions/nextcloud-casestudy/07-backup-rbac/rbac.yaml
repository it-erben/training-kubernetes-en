apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextcloud-backup
  namespace: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-backup
  namespace: nextcloud
rules:
  # Find the MariaDB pod by label.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Run a command only in the MariaDB StatefulSet pod.
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["nextcloud-db-0"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-backup
  namespace: nextcloud
subjects:
  - kind: ServiceAccount
    name: nextcloud-backup
    namespace: nextcloud
roleRef:
  kind: Role
  name: nextcloud-backup
  apiGroup: rbac.authorization.k8s.io
