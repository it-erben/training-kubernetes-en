checks:
  exclude:
    - "no-anti-affinity"
    - "run-as-non-root"
    - "no-read-only-root-fs"
    - "drop-net-raw-capability"
    - "no-privileged-containers"
    # lab-17-pss/error-pod.yaml is privileged on purpose (demonstrates a Pod
    # Security Standards rejection). The real kube-linter check names are
    # privileged-container and privilege-escalation-container (the existing
    # "no-privileged-containers" entry above is not a real check, so it is a
    # no-op kept for clarity); both must be excluded for it to pass.
    - "privileged-container"
    - "privilege-escalation-container"
    - "readiness-port"
    - "liveness-port"
    - "latest-tag"
    - "pdb-min-available"
    # The lab-06 Helm chart (solutions/nextcloud-casestudy/06-helm-chart) quotes
    # its templated Service selectors (e.g. app: "{{ .Release.Name }}-db"), so
    # kube-linter parses them as valid YAML and then rejects the literal
    # "{{ .Release.Name }}-..." as an invalid label value. The placeholder is
    # only resolved at `helm template` time, so exclude dangling-service here.
    - "dangling-service"
    # lab-07 restore-job.yaml is a one-shot restore Job intended to be run
    # manually; ttlSecondsAfterFinished would auto-cleanup, but that is out of
    # scope for this lab. Exclude the check to allow the Job to pass linting.
    - "job-ttl-seconds-after-finished"
