include:
  - component: "gitlab.com/it-erben/components/pdf-publisher/build-publish@1.8.1"
  - component: "gitlab.com/it-erben/components/linters/lychee-lint@1.3.1"
  - component: "gitlab.com/it-erben/components/linters/yaml-lint@1.3.1"
  - component: "gitlab.com/it-erben/components/linters/markdown-lint@1.3.1"
  - component: "gitlab.com/it-erben/components/release/release@1.1.1"
  - component: "gitlab.com/it-erben/components/training-deploy/deploy@1.4.1"

# Run a pipeline for merge requests, for every branch push, and for tags
# (release). The middle rule prevents a duplicate branch pipeline while an MR is
# open, so each change is validated exactly once.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - build
  - verify
  - validate
  - release
  - deploy

# Checks run on MRs AND on direct branch/main pushes (so a push to main without
# an MR is still validated). Pipeline-level dedup is handled by workflow above.
.checks-rules: &checks-rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH

# The markdown-lint and yaml-lint components only run on merge requests by
# default. Override their rules so they also run on branch/main pushes —
# otherwise lint errors can land on main unnoticed (they did before). Matches
# the *checks-rules used by the local lint jobs below.
lint:markdown:
  rules: *checks-rules

lint:yaml:
  rules: *checks-rules
  # Skip Helm chart templates: their Go templating (`{{- ... }}`) is not valid
  # YAML, so yamllint cannot parse it. kubeconform skips them the same way.
  script: |
    pip install --no-cache-dir yamllint
    yamllint -d "{extends: relaxed, ignore: ['*.md', '**/templates/**'], rules: {line-length: {max: 140}}}" .

lint:helm:
  stage: lint
  rules: *checks-rules
  image: alpine:3.23.3
  before_script:
    - apk add --no-cache curl bash findutils
    - HELM_VERSION=v3.14.4
    - curl -sSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz
    - tar -xzf /tmp/helm.tar.gz -C /tmp
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
  script:
    - bash -lc 'set -euo pipefail; find . -name Chart.yaml -print0 | while IFS= read -r -d "" chart; do chart_dir="$(dirname "$chart")"; echo "Linting ${chart_dir}"; helm lint "$chart_dir"; helm template "$chart_dir" > /dev/null; done'

lint:kube-linter:
  stage: lint
  rules: *checks-rules
  image: alpine:3.23
  before_script:
    - apk add --no-cache curl bash findutils
    - KUBE_LINTER_VERSION=v0.6.8
    - curl -sSL -o /tmp/kube-linter.tar.gz https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz
    - tar -xzf /tmp/kube-linter.tar.gz -C /usr/local/bin kube-linter
  script:
    - find labs solutions -name '*.yaml' -print0 | xargs -0 -r kube-linter lint

validate:kubeconform:
  stage: validate
  rules: *checks-rules
  image: alpine:3.23.3
  before_script:
    - apk add --no-cache curl bash findutils
    - KUBECONFORM_VERSION=v0.6.7
    - curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz
    - tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
  script:
    - |
      find labs solutions -name '*.yaml' \
        -not -path '*/templates/*' \
        -not -name 'Chart.yaml' \
        -not -name 'values.yaml' \
        -print0 \
        | xargs -0 -r kubeconform -strict -summary -kubernetes-version "1.35.0" \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}.json' \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

# The live chainsaw suite (tests/) needs a real Kubernetes cluster via kind,
# which GitLab.com shared runners can't start (kubeadm control-plane init fails
# in nested Docker-in-Docker). It runs locally and on Docker-capable runners
# instead: tests/bootstrap.sh && chainsaw test tests. See tests/README.md.
